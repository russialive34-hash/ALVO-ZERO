<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f86e8">
<title>QUEDA LIVRE</title>
<link rel="icon" href="icone.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="tres"></div>
<div id="flash" class="flash"></div>

<!-- LOBBY -->
<section id="tLobby" class="tela lobby">
  <header class="l-topo">
    <div class="perfil" id="btPerfil"><i id="lAvatar"></i><div><b id="lNome">Jogador</b><small>Nv. <span id="lNivel">1</span></small></div></div>
    <div class="moedas"><span>🪙 <b id="lMoedas">0</b></span><span>💎 <b id="lGemas">0</b></span></div>
    <div class="logo">QUEDA<b>LIVRE</b></div>
    <button class="ic" id="btSom">🔊</button><button class="ic" id="btConfig">⚙</button>
  </header>
  <nav class="l-menu">
    <button id="btPersonagens"><i>👤</i>PERSONAGENS</button>
    <button id="btRanking"><i>🏆</i>RANKING</button>
    <button id="btComo"><i>📖</i>COMO JOGAR</button>
    <button id="btNovidades"><i>✨</i>NOVIDADES</button>
  </nav>
  <div class="l-nome-boneco"><b id="lBoneco">Kai</b><small>toque nas setas para trocar</small></div>
  <button class="seta esq" id="btAnt">‹</button><button class="seta dir" id="btProx">›</button>
  <div class="l-dir">
    <div class="modo"><small>BR CLÁSSICO</small><b>Ilha Coral</b><span>20 jogadores · solo</span></div>
    <button class="decolar" id="btDecolar">DECOLAR</button>
  </div>
</section>

<!-- VAGÃO DE ESPERA -->
<section id="tCabine" class="tela cabine" hidden>
  <div class="c-topo"><b>EXPRESSO CÉU</b><span>Chegando na ilha em <b id="cConta">30</b>s</span><small id="cJog">1 jogador</small></div>
  <p class="c-dica">Arraste a tela para olhar o trem</p>
  <button class="bt-pq" id="btComecar">PARTIR AGORA</button>
</section>

<!-- PARTIDA -->
<section id="tJogo" class="tela jogo" hidden>
  <canvas id="mini" class="mini" width="200" height="200"></canvas>
  <div class="bussola"><div id="bussola"></div><i></i></div>
  <div class="grau" id="hGrau">0</div>
  <div id="aviso" class="aviso"></div>
  <div class="cont"><span class="moeda">🪙 <b id="hMoedas">0</b></span><span class="vivos">👤 <b id="hVivos">20</b></span><span class="kills">💀 <b id="hKills">0</b></span></div>
  <div id="marcas" class="marcas"></div>
  <div id="feed" class="feed"></div>
  <div id="mira" class="mira"><i></i><i></i><i></i><i></i></div>
  <div id="hit" class="hit"></div>
  <div id="numeros" class="numeros"></div>
  <div id="escopo" class="escopo" hidden><div class="vidro"><i class="h"></i><i class="v"></i><b id="escopoTxt">4x</b></div></div>
  <div id="ponto" class="ponto" hidden><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid meet"><rect x="40" y="20" width="320" height="200" rx="70" fill="none" stroke="#9aa3ab" stroke-width="34"/><rect x="40" y="20" width="320" height="200" rx="70" fill="none" stroke="#c9d1d8" stroke-width="10"/><rect x="58" y="38" width="284" height="164" rx="56" fill="rgba(160,220,255,.06)" stroke="#1b1f24" stroke-width="5"/><path d="M150 236h100l20 64H130z" fill="#9aa3ab"/><path d="M120 250h30v50h-30zM250 250h30v50h-30z" fill="#4fa3e8"/><circle cx="200" cy="120" r="4" fill="#ff2a1a"/><circle cx="200" cy="120" r="9" fill="none" stroke="#ff2a1a" stroke-width="1.5" opacity=".7"/></svg></div>
  <div id="dirDano" class="dir-dano"></div>
  <div id="altura" class="altura" hidden><b id="hAlt">200</b>m</div>
  <div class="hp"><div class="prot"><span id="hCol">🦺 —</span><span id="hCap">⛑ —</span></div><div class="barra"><i id="hBar"></i></div><small>HP <b id="hHp">200</b>/200</small></div>
  <div id="armas" class="armas"></div>
  <div id="loot" class="loot"></div>
  <div id="acao" class="acao-barra" hidden><small id="acaoTxt">CURANDO</small><div><i id="acaoBar"></i></div></div>
  <div id="toque" class="toque">
    <div id="joy" class="joy"><i id="joyP"></i></div>
    <button class="tb tiro" id="bTiro"></button>
    <button class="tb tiro2" id="bTiro2"></button>
    <button class="tb mirar" id="bMira">◎</button>
    <button class="tb pular" id="bPulo">⤒</button>
    <button class="tb agachar" id="bAg">⤓</button>
    <button class="tb recarga" id="bRec">↻</button>
    <button class="tb gelo" id="bGelo">❄<small id="nGelo">0</small></button>
    <button class="tb kit" id="bKit">✚<small id="nKit">0</small></button>
    <button class="grande" id="bPularTrem" hidden>PULAR</button>
    <button class="grande para" id="bPara" hidden>ABRIR PARAQUEDAS</button>
  </div>
</section>

<div id="mapaG" class="mapa-g" hidden><canvas id="mapaC" width="600" height="600"></canvas><button class="bt-pq" id="btFecharMapa">FECHAR</button></div>
<div id="fim" class="fim" hidden></div>
<div id="janela" class="janela" hidden></div>
<div id="carregando" class="carregando" hidden><b>QUEDA LIVRE</b><small id="carTxt">montando a ilha…</small></div>
<div id="girar" class="girar"><p>↻ Vire o celular deitado</p></div>

<script src="vendor/three.min.js"></script>
<script src="shared/regras.js"></script>
<script src="som.js"></script>
<script src="armas.js"></script>
<script src="boneco.js"></script>
<script src="mundo.js"></script>
<script src="jogo.js"></script>
</body>
</html>
